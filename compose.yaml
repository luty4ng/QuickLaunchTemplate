# Deployment stack: database + one-shot migration + API/web container.
#
#   docker compose up -d --wait
#
# Two deliberate choices:
#   * migrations run as their own service (`migrate`) and the app waits for it -
#     never inside the app's start command, so a restart loop can never run
#     migrations concurrently with a rollout;
#   * the app image is pulled by tag, and CD overrides `APP_IMAGE` with the
#     exact sha- tag it just built, which is also the rollback anchor.

# The project name shows up in container/volume names, so it comes from
# project.env (deploy.sh exports it) rather than being written twice. The
# fallback is checked against project.env by `scripts/project_env.py check`,
# because compose needs *some* value when a human runs it by hand.
name: ${COMPOSE_PROJECT_NAME:-quicklaunch}

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-quicklaunch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quicklaunch}
      POSTGRES_DB: ${POSTGRES_DB:-quicklaunch}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-quicklaunch} -d ${POSTGRES_DB:-quicklaunch}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    image: ${APP_IMAGE:-ghcr.io/luty4ng/quicklaunchtemplate:latest}
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-quicklaunch}:${POSTGRES_PASSWORD:-quicklaunch}@db:5432/${POSTGRES_DB:-quicklaunch}
    working_dir: /app/backend
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  app:
    image: ${APP_IMAGE:-ghcr.io/luty4ng/quicklaunchtemplate:latest}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-quicklaunch}:${POSTGRES_PASSWORD:-quicklaunch}@db:5432/${POSTGRES_DB:-quicklaunch}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      AUTO_MIGRATE: "false"
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      WEB_DIST: /app/web/dist
      # Billing. Empty on the deployment until real values are put in .env, which
      # makes the billing endpoints answer 503 rather than half-work; CI points
      # them at scripts/fake_stripe.py so the payment path is exercised.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_PLUS: ${STRIPE_PRICE_PLUS:-}
      STRIPE_PRICE_PRO: ${STRIPE_PRICE_PRO:-}
      STRIPE_API_BASE: ${STRIPE_API_BASE:-}
    extra_hosts:
      # Lets the container reach a service on the host, which is how CI runs the
      # fake payment provider next to the stack. Harmless when unused.
      - "host.docker.internal:host-gateway"
    ports:
      - "${APP_PORT:-8000}:8000"
    restart: unless-stopped

volumes:
  db-data:
