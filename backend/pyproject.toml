[project]
name = "quicklaunch-backend"
version = "1.0.0"
description = "QuickLaunch demo API - FastAPI backend for the CI/CD pipeline demo"
requires-python = ">=3.11"

# Lint/format configuration lives in the repository-root ruff.toml so that every
# invocation - from backend/ or from the root - resolves the same settings.
# A green local run must mean a green pipeline; see ruff.toml for why.

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: exercises HTTP endpoints end to end (needs a migrated database)",
]
