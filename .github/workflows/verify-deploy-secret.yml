name: verify-deploy-secret

# TEMPORARY. Deleted as soon as it has answered one question: does the
# DEPLOY_SSH_KEY secret in this repository hold the deploy private key whose
# public half is installed on the server?
#
# GitHub has no API to read a secret back, so the only way to check the stored
# value is to let a workflow use it. This prints the key's FINGERPRINT - public
# information - and never the key itself, then deletes the temp file.
#
# Expected fingerprint: SHA256:S/hiR65Izc3surRmZYzrQBSRq/ixEGHhYVs86L43boA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fingerprint:
    name: fingerprint the stored deploy key
    runs-on: ubuntu-latest
    steps:
      - name: write the secret to a temp file and fingerprint it
        env:
          # Assembled from two halves so the secret's own line is never expanded
          # into the script text, only into a file.
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_SSH_KEY:-}" ]; then
            echo "::error::DEPLOY_SSH_KEY is empty or unset"
            exit 1
          fi

          keyfile="$(mktemp)"
          # Strip CR so a key pasted from Windows still parses, and keep the
          # trailing newline ssh-keygen expects.
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > "$keyfile"
          chmod 600 "$keyfile"

          echo "first line : $(head -n1 "$keyfile")"
          echo "last line  : $(tail -n1 "$keyfile")"
          echo "line count : $(wc -l < "$keyfile")"

          fingerprint="$(ssh-keygen -lf "$keyfile" | awk '{print $2}')"
          rm -f "$keyfile"

          expected="SHA256:S/hiR65Izc3surRmZYzrQBSRq/ixEGHhYVs86L43boA"
          echo "stored fingerprint: $fingerprint"
          echo "expected          : $expected"
          {
            echo "### deploy key verification"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| stored | \`$fingerprint\` |"
            echo "| expected | \`$expected\` |"
            echo "| match | $([ "$fingerprint" = "$expected" ] && echo 'yes' || echo 'NO') |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$fingerprint" != "$expected" ]; then
            echo "::error::the stored DEPLOY_SSH_KEY is not the key installed on the server"
            exit 1
          fi
          echo "::notice::DEPLOY_SSH_KEY matches the key installed on luty-server"
