name: pipeline

# One file, because every job here answers the same question: "is this commit
# shippable?". CI and CD are separate jobs joined by `needs:`, which is simpler
# and safer than chaining two workflow files with `workflow_run` (that needs an
# extra token and is easy to get subtly wrong).
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Desktop version to stamp. Defaults to 1.0.<run number>, which is always
          higher than the previous build, so installed clients update. Pass a
          LOWER version (e.g. 0.0.1) to package a build that the published
          release is newer than - that is how the update path is tested.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '22'
  # GHCR rejects upper-case paths. This repository is "QuickLaunchTemplate", so
  # the name must be lower-cased here - using github.repository directly works
  # until the first push and then fails in the most confusing way possible.
  IMAGE: ghcr.io/${{ github.repository_owner }}/quicklaunchtemplate

jobs:
  # ---------------------------------------------------------------------
  # 0a. The desktop version for this build.
  #
  #      It has to be higher than the last release or electron-updater will
  #      never offer the update to installed clients - and it must be
  #      overridable, because testing the update path needs a version that is
  #      deliberately LOWER than the published one.
  # ---------------------------------------------------------------------
  versioning:
    name: versioning
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pick.outputs.version }}
    steps:
      - id: pick
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION:-1.0.${{ github.run_number }}}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "not a semver version: $version"; exit 1
          fi
          echo "desktop version for this build: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------
  # 0b. Change detection, so a docs-only commit does not rebuild 3 clients.
  # ---------------------------------------------------------------------
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      web: ${{ steps.filter.outputs.web }}
      deployable: ${{ steps.filter.outputs.deployable }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'scripts/**'
              - 'Dockerfile'
              - 'compose.yaml'
              - '.github/workflows/**'
            web:
              - 'web/**'
              - 'desktop/**'
              - 'mobile/**'
              - '.github/workflows/**'
            # Anything whose result ends up inside the shipped image. `deploy`
            # gates on this: pushing a new image and then not smoke testing it is
            # how an unverified artifact becomes the one production pulls.
            deployable:
              - 'backend/**'
              - 'web/**'
              - 'scripts/smoke.py'
              - 'Dockerfile'
              - 'compose.yaml'
              - '.github/workflows/**'

  # ---------------------------------------------------------------------
  # 1. CI - the gates. Nothing ships unless these are green.
  # ---------------------------------------------------------------------
  verify-backend:
    name: backend / lint + unit + integration
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'

    services:
      # Same major version as production: that is what turns "will the
      # migration work in production?" into a CI question.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: quicklaunch
          POSTGRES_PASSWORD: quicklaunch
          POSTGRES_DB: quicklaunch_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U quicklaunch"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql+psycopg://quicklaunch:quicklaunch@localhost:5432/quicklaunch_test
      JWT_SECRET: ci-secret-that-is-definitely-long-enough-for-hs256
      BCRYPT_ROUNDS: '4'

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: lint and format (ruff)
        working-directory: backend
        run: |
          ruff check .
          ruff format --check .
          # scripts/ is part of the delivery path: smoke.py is a deploy gate and
          # desktop_api_stub.py runs during desktop verification.
          ruff check ../scripts
          ruff format --check ../scripts

      - name: migrations apply to postgres 16
        working-directory: backend
        run: alembic upgrade head

      - name: migrations are reversible
        working-directory: backend
        run: |
          alembic downgrade base
          alembic upgrade head

      - name: unit tests (no database)
        working-directory: backend
        run: pytest tests/unit -q

      - name: integration tests (real postgres, real HTTP)
        working-directory: backend
        run: pytest tests/integration -q

  verify-web:
    name: web / lint + types + unit + build
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.web == 'true'

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: install dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund

      - name: lint
        working-directory: web
        run: npm run lint

      - name: typecheck
        working-directory: web
        run: npm run typecheck

      - name: unit tests
        working-directory: web
        run: npm test

      - name: production build
        working-directory: web
        run: npm run build

      - name: process the built bundle
        working-directory: web
        run: |
          # The bundle must be root-relative ("." base) so the identical artifact
          # also loads from app://bundle and from the Android WebView. That comes
          # from web/.env, not from a per-job environment variable, so every job
          # cannot drift from the others.
          grep -q 'src="\./assets/' dist/index.html \
            || { echo "dist/index.html does not use relative asset paths"; cat dist/index.html; exit 1; }
          echo "bundle uses relative asset paths"

      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist
          retention-days: 7

  # ---------------------------------------------------------------------
  # 2. CD - build the artifact, ship it, then prove it works.
  # ---------------------------------------------------------------------
  docker:
    name: cd / build + push image
    runs-on: ubuntu-latest
    needs: [verify-backend, verify-web]
    # `always()` so a skipped verify (no changes in that area) does not block
    # the release; a *failed* verify still does, because that is a real failure.
    if: |
      always()
      && !cancelled()
      && !contains(needs.*.result, 'failure')
      && github.event_name != 'pull_request'

    permissions:
      contents: read
      packages: write

    outputs:
      digest: ${{ steps.build.outputs.digest }}
      tags: ${{ steps.meta.outputs.tags }}

    steps:
      - uses: actions/checkout@v7

      # arm64 is emulated, which is slow; the demo ships a single-arch image.
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Keep the exact bytes we just pushed, so the smoke test below exercises
      # this build and not a re-pull that could race.
      - name: export image for the deploy stage
        run: docker save "${{ env.IMAGE }}:sha-${GITHUB_SHA::7}" -o /tmp/image.tar

      - uses: actions/upload-artifact@v7
        with:
          name: app-image
          path: /tmp/image.tar
          retention-days: 1

  deploy:
    name: cd / deploy + smoke test
    runs-on: ubuntu-latest
    needs: [changes, docker]
    # Smoke test every image that could actually be pulled. If the image was
    # built from unchanged code, `docker` still pushes a new sha- tag, and that
    # tag must not go untested just because the verify jobs were skipped.
    if: |
      always()
      && needs.docker.result == 'success'
      && (needs.changes.outputs.deployable == 'true' || github.event_name == 'workflow_dispatch')

    # compose.yaml interpolates these for every docker compose command, not just
    # the one that starts the stack - without them even `compose down` fails with
    # "required variable JWT_SECRET is missing a value".
    env:
      JWT_SECRET: deploy-time-secret-that-is-long-enough-0001
      POSTGRES_PASSWORD: ci-postgres-password
      APP_PORT: '8000'

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: app-image
          path: /tmp

      # The migrations service in compose.yaml runs first and the app waits for
      # it, so a broken schema change fails here - loudly - instead of surfacing
      # as 500s after the rollout. Gating is explicit rather than relying on
      # `--wait` semantics, so the log says exactly which condition was met.
      - name: start the stack
        env:
          APP_IMAGE: ${{ env.IMAGE }}:sha-${{ github.sha }}
        run: |
          set -euo pipefail
          short="${GITHUB_SHA::7}"
          docker load -i /tmp/image.tar
          docker tag "${IMAGE}:sha-${short}" "${IMAGE}:sha-${GITHUB_SHA}"
          export APP_IMAGE="${IMAGE}:sha-${GITHUB_SHA}"

          docker compose -f compose.yaml up -d --wait db
          for i in $(seq 1 30); do
            state=$(docker inspect --format '{{.State.Health.Status}}' "$(docker compose ps -q db)")
            [ "$state" = "healthy" ] && break
            sleep 1
          done
          echo "db health: $state"
          [ "$state" = "healthy" ]

          echo "--- applying migrations (one-shot service) ---"
          docker compose -f compose.yaml up --exit-code-from migrate migrate

          echo "--- starting the app ---"
          docker compose -f compose.yaml up -d --wait app
          docker compose -f compose.yaml ps -a

      - name: show container state
        if: always()
        run: |
          docker compose -f compose.yaml ps -a || true
          for c in $(docker compose -f compose.yaml ps -aq); do
            echo "===== inspect $c ====="
            docker inspect --format '{{.Name}} state={{.State.Status}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}} exit={{.State.ExitCode}}' "$c"
            echo "----- last health probe output -----"
            docker inspect --format '{{range .State.Health.Log}}{{.ExitCode}}: {{.Output}}{{end}}' "$c" 2>/dev/null | tail -c 800 || true
          done
          echo "===== migrate logs ====="
          docker compose -f compose.yaml logs migrate || true
          echo "===== app logs ====="
          docker compose -f compose.yaml logs app || true

      - name: smoke test the live deployment
        run: python3 scripts/smoke.py --base-url http://127.0.0.1:8000 --health-budget-ms 1000

      - name: verify the image healthcheck agrees
        run: |
          cid="$(docker compose -f compose.yaml ps -q app)"
          # Docker checks every 10s; polling avoids racing the check interval.
          for i in $(seq 1 18); do
            state="$(docker inspect --format '{{.State.Health.Status}}' "$cid")"
            echo "container health: $state"
            [ "$state" = "healthy" ] && exit 0
            sleep 5
          done
          echo "container never reported healthy"; exit 1

      # Rollback rehearsal: redeploy the previous sha- tag and prove the service
      # comes back. Skipped on the very first successful build, when there is no
      # earlier tag to go back to. continue-on-error keeps a rehearsal failure
      # from failing an otherwise healthy deploy, but the next step reports the
      # outcome loudly rather than swallowing it.
      - name: rollback rehearsal
        id: rollback
        continue-on-error: true
        env:
          PREVIOUS_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ -z "${PREVIOUS_SHA:-}" ] || [ "${PREVIOUS_SHA}" = "0000000000000000000000000000000000000000" ]; then
            echo "no previous commit on this ref; nothing to roll back to"; exit 0
          fi
          previous="${PREVIOUS_SHA:0:7}"
          echo "redeploying ${IMAGE}:sha-${previous}"
          docker compose -f compose.yaml down -v
          docker pull "${IMAGE}:sha-${previous}"
          export APP_IMAGE="${IMAGE}:sha-${previous}"
          docker compose -f compose.yaml up -d --wait db
          docker compose -f compose.yaml up --exit-code-from migrate migrate
          docker compose -f compose.yaml up -d --wait app
          python3 scripts/smoke.py --base-url http://127.0.0.1:8000 --skip-spa

      - name: report the rollback rehearsal
        if: always() && steps.rollback.outcome != 'skipped'
        run: |
          if [ "${{ steps.rollback.outcome }}" = "success" ]; then
            echo "::notice::rollback rehearsal passed: the previous sha- tag redeployed and served traffic"
          else
            echo "::warning::rollback rehearsal did NOT complete - check the previous sha- tag exists in GHCR"
          fi

      - name: tear down
        if: always()
        run: docker compose -f compose.yaml down -v || true

  # ---------------------------------------------------------------------
  # 3. The other two clients. Same web bundle, wrapped twice.
  #
  # Desktop packaging is split by platform on purpose: electron-builder builds a
  # Windows NSIS installer by driving Wine, and "spawn wine ENOENT" is what that
  # looks like from a Linux runner. Whatever the host OS is, it builds that OS's
  # installer - no emulation.
  # ---------------------------------------------------------------------
  desktop:
    name: desktop / package (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    needs: [changes, verify-web, versioning]
    if: |
      always()
      && needs.verify-web.result != 'failure'
      && needs.verify-web.result != 'cancelled'
      && needs.versioning.result == 'success'
      && github.event_name != 'pull_request'

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows
            runner: windows-latest
            script: dist:win
            artifact: desktop-windows
          - target: linux
            runner: ubuntu-latest
            script: dist:linux
            artifact: desktop-linux

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            web/package-lock.json

      - name: install toolchains
        working-directory: desktop
        run: npm ci --no-audit --no-fund

      - name: unit tests (update version comparison)
        working-directory: desktop
        run: npm test

      # The version decides whether installed clients ever see this update:
      # electron-updater only offers a version strictly higher than the running
      # one, so "1.0.0" for every build would silently never update anyone.
      - name: stamp the build version
        working-directory: desktop
        run: npm run stamp -- ${{ needs.versioning.outputs.version }}

      # The desktop shell ships the web bundle as a resource. Reuse the web
      # job's artifact when it exists, but do not depend on it: that job is
      # skipped when nothing under web/ changed, and a missing artifact would
      # otherwise fail an unrelated desktop build. (Observed exactly that in
      # run #34653287358.)
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: web-dist
          path: web/dist

      - name: make sure web/dist has a relative-path bundle
        shell: bash
        env:
          # The web job builds with a relative base and that artifact is reused
          # as-is. When it is missing, this rebuild must produce the same shape,
          # or the packaged app loads /assets/... from app://bundle and shows a
          # blank window.
          VITE_WEB_BASE: './'
        run: |
          set -euo pipefail
          # The artifact may have landed one level down; normalise it.
          if [ ! -f web/dist/index.html ]; then
            found="$(find web/dist -name index.html -print -quit 2>/dev/null || true)"
            if [ -n "$found" ]; then
              mv "$(dirname "$found")" web/dist-normalised
              rm -rf web/dist
              mv web/dist-normalised web/dist
            fi
          fi
          # A bundle with absolute asset URLs cannot be loaded from app://; treat
          # it as unusable and rebuild rather than shipping a blank window.
          if [ -f web/dist/index.html ] && ! grep -q 'src="\./assets/' web/dist/index.html; then
            echo "artifact uses absolute asset paths; rebuilding with a relative base"
            rm -rf web/dist
          fi
          if [ -f web/dist/index.html ]; then
            echo "reusing the web job's artifact"; ls -la web/dist; exit 0
          fi
          echo "no usable web artifact (that job was skipped); building here"
          cd web && npm ci --no-audit --no-fund && npm run build
          test -f dist/index.html
          grep -q 'src="\./assets/' dist/index.html

      - name: package
        working-directory: desktop
        env:
          # Public URL the packaged app talks to by default. Empty = same origin.
          QL_API_BASE: ${{ vars.QL_API_BASE }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        # `--publish never`: the publish provider is configured so electron-builder
        # writes latest.yml, but uploading is the release job's business. Without
        # this flag electron-builder tries to publish during the build and fails
        # demanding GH_TOKEN.
        run: npm run ${{ matrix.script }} -- --publish never

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            desktop/release/*.exe
            desktop/release/*.zip
            desktop/release/*.AppImage
            desktop/release/*.deb
            # latest.yml is the update feed electron-updater reads; blockmap is
            # what lets it download only the changed bytes.
            desktop/release/latest.yml
            desktop/release/*.blockmap
          if-no-files-found: error
          retention-days: 7

      - name: show what the release will contain
        working-directory: desktop
        run: |
          ls -lh release || true
          echo "--- latest.yml (the update feed clients read) ---"
          cat release/latest.yml || echo "MISSING latest.yml - installed clients could never update"

  # Packaging a desktop app is not evidence that it runs. This job installs the
  # artifact on a real Windows machine, boots it headlessly, and lets it call the
  # API from inside the renderer.
  desktop-self-test:
    name: desktop / self-test the packaged app (windows)
    runs-on: windows-latest
    needs: desktop

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: desktop-windows
          path: dist

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: unpack the built app
        shell: pwsh
        run: |
          # The zip target is a plain archive of the packaged app directory.
          # Extracting a self-extracting installer would work too, but it
          # launches the app as a side effect - not what a CI step wants.
          Write-Host "artifact contents:"
          Get-ChildItem dist | Select-Object Name, Length | Format-Table | Out-String | Write-Host
          $zip = Get-ChildItem dist -Filter '*.zip' | Select-Object -First 1
          if (-not $zip) { throw "no desktop zip in the artifact" }
          Expand-Archive -Path $zip.FullName -DestinationPath "$PWD\app" -Force
          Get-ChildItem "$PWD\app" | Select-Object -First 10 Name

      - name: stub the API the shell will call
        shell: pwsh
        run: |
          # On Windows, a process started by a step is cleaned up when the step
          # ends unless it is truly detached. The stub must outlive this step,
          # so it is launched through WMI (Win32_Process.Create), which creates it
          # outside this process tree.
          $log = Join-Path $PWD 'stub.log'
          $cmd = "python `"$PWD\scripts\desktop_api_stub.py`" > `"$log`" 2>&1"
          $created = Invoke-CimMethod -ClassName Win32_Process -MethodName Create -Arguments @{ CommandLine = "cmd.exe /c $cmd" }
          Write-Host "stub launched, pid $($created.ProcessId)"

          for ($i = 0; $i -lt 40; $i++) {
            try { Invoke-WebRequest -Uri 'http://127.0.0.1:8123/api/health' -UseBasicParsing | Out-Null; break }
            catch { Start-Sleep -Milliseconds 500 }
          }
          $health = Invoke-WebRequest -Uri 'http://127.0.0.1:8123/api/health' -UseBasicParsing
          Write-Host "stub health: $($health.Content)"
          if (-not $health) { throw 'the stub API did not start' }

      - name: run the packaged app's self test
        timeout-minutes: 5
        shell: pwsh
        env:
          QL_API_BASE: http://127.0.0.1:8123
          # Surfaces renderer console output (CORS, CSP, load failures) in the
          # job log; without it a "blank window" is undiagnosable from CI.
          ELECTRON_ENABLE_LOGGING: '1'
          # Check the real update feed but do not pull a 110 MB installer: this
          # step proves detection, the release step proves the feed is published.
          QL_UPDATE_AUTODOWNLOAD: 'false'
        run: |
          # Fail early and clearly if the stub is gone, instead of reporting a
          # mysterious network error from inside the app.
          try {
            $health = Invoke-WebRequest -Uri 'http://127.0.0.1:8123/api/health' -UseBasicParsing -TimeoutSec 5
            Write-Host "stub reachable before the test: $($health.Content)"
          } catch {
            throw "the stub API is not running before the self test: $($_.Exception.Message)"
          }

          $exe = Get-ChildItem "$PWD\app" -Filter 'QuickLaunch.exe' -Recurse | Select-Object -First 1
          if (-not $exe) { throw 'QuickLaunch.exe not found after extraction' }
          Write-Host "running $($exe.FullName)"

          # A GUI process is not guaranteed to be waited on, and a frozen window
          # would hang the job forever. Start it, wait for the report file with a
          # deadline, then make sure nothing is left running.
          $report = Join-Path $PWD 'ql-self-test.json'
          Remove-Item $report -ErrorAction SilentlyContinue
          $proc = Start-Process -FilePath $exe.FullName -PassThru -NoNewWindow `
            -ArgumentList '--ql-self-test', "--ql-self-test-report=$report"
          $deadline = (Get-Date).AddSeconds(90)
          while (-not (Test-Path $report) -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 500 }

          $children = Get-Process -Name 'QuickLaunch' -ErrorAction SilentlyContinue
          if ($children) { $children | Stop-Process -Force -ErrorAction SilentlyContinue }
          Start-Sleep -Seconds 1

          if (-not (Test-Path $report)) { throw 'the app never reported a self-test result within 90s' }
          $json = Get-Content $report -Raw | ConvertFrom-Json
          # Depth 8 so the nested probe results survive serialisation.
          Write-Host "self test report: $($json | ConvertTo-Json -Depth 8 -Compress)"
          if (Test-Path 'stub.log') { Write-Host "--- stub log ---"; Get-Content 'stub.log' | Select-Object -Last 20 }
          if (-not $json.ok) { throw "self test failed: $($json | ConvertTo-Json -Depth 8 -Compress)" }
          Write-Host 'desktop artifact verified'

      - name: stop the stub
        if: always()
        shell: pwsh
        run: |
          Get-CimInstance Win32_Process -Filter "Name = 'python.exe'" |
            Where-Object { $_.CommandLine -like '*desktop_api_stub*' } |
            ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
          Write-Host 'stub stopped'

  android:
    name: android / build apk
    runs-on: ubuntu-latest
    needs: [changes, verify-web]
    if: |
      always()
      && needs.verify-web.result != 'failure'
      && needs.verify-web.result != 'cancelled'
      && github.event_name != 'pull_request'

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      # The runner image already ships a JDK and the Android SDK; this pins them
      # so a runner image bump cannot silently change the build.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v4

      - name: install the exact platform Capacitor asks for
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          yes | sdkmanager --licenses > /dev/null || true

      - name: install capacitor toolchain
        working-directory: mobile
        run: npm ci --no-audit --no-fund

      # verify_apk.py is plain stdlib Python, but the runner only guarantees
      # `python3`; ask setup-python for a known interpreter instead of hoping.
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: build web bundle for the WebView
        working-directory: web
        env:
          VITE_WEB_BASE: './'
          # Capacitor copies whatever `webDir` points at, so the bundle has to be
          # emitted straight into mobile/www - building to web/dist and syncing
          # fails with "Could not find the web assets directory: ./www".
          VITE_OUT_DIR: ../mobile/www
          # The APK must call a reachable server. Set the repository variable
          # QL_API_BASE to the deployed URL; localhost would only work on an
          # emulator, which is why the runtime override in the UI exists too.
          VITE_API_BASE: ${{ vars.QL_API_BASE }}
        run: |
          npm ci --no-audit --no-fund
          npm run build
          # Fail here, with a clear message, rather than inside cap sync.
          test -f ../mobile/www/index.html

      - name: generate the native project, then copy the bundle into it
        working-directory: mobile
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android
          test -f android/app/src/main/assets/public/index.html
          echo "cap sync ok"

      - name: build the debug apk (signed with the standard debug key)
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: report apk
        working-directory: mobile
        run: ls -lh android/app/build/outputs/apk/debug/

      - name: verify the apk actually contains our app
        working-directory: mobile
        run: |
          apk="$(find android/app/build/outputs/apk/debug -name '*.apk' | head -n1)"
          python ../scripts/verify_apk.py "$apk"

      - uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------
  # 4. Everything a user can actually download, in one place.
  # ---------------------------------------------------------------------
  release:
    name: release / publish build
    runs-on: ubuntu-latest
    needs: [versioning, docker, deploy, desktop, desktop-self-test, android]
    if: |
      always()
      && !cancelled()
      && !contains(needs.*.result, 'failure')
      && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)

    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: android-apk
          path: dist/android

      - uses: actions/download-artifact@v8
        with:
          name: desktop-windows
          path: dist/desktop

      - uses: actions/download-artifact@v8
        with:
          name: desktop-linux
          path: dist/linux

      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: dist/web
        continue-on-error: true

      - name: assemble the release bundle
        run: |
          set -euo pipefail
          cd dist
          if [ -f web/index.html ]; then
            zip -qr "web-${GITHUB_SHA::7}.zip" web
            rm -rf web
          else
            echo "no static web artifact in this run (web/ unchanged); skipping that zip"
          fi
          ls -lhR .

      # electron-updater reads latest.yml out of the newest release. Without it
      # in the release, every installed client silently stops seeing updates.
      - name: check the update feed is part of this release
        run: |
          set -euo pipefail
          if [ ! -f dist/desktop/latest.yml ]; then
            echo "::error::latest.yml is missing - installed desktop clients would never update"
            exit 1
          fi
          echo "latest.yml:"; cat dist/desktop/latest.yml
          grep -q "version: ${{ needs.versioning.outputs.version }}" dist/desktop/latest.yml \
            || { echo "::error::latest.yml does not advertise version ${{ needs.versioning.outputs.version }}"; exit 1; }

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.versioning.outputs.version }}
          name: QuickLaunch ${{ needs.versioning.outputs.version }}
          body: |
            Desktop build **${{ needs.versioning.outputs.version }}** from `${{ github.sha }}`.

            Installed Windows clients update themselves: they read `latest.yml` from this
            release, download in the background and install on one click.

            | target | artifact |
            |---|---|
            | desktop (Windows) | `QuickLaunch-Setup-${{ needs.versioning.outputs.version }}-x64.exe` installer, `QuickLaunch-${{ needs.versioning.outputs.version }}-win.zip` unpacked |
            | desktop (update feed) | `latest.yml`, `*.blockmap` - what electron-updater downloads |
            | desktop (Linux) | `*.AppImage`, `*.deb` |
            | android | `app-debug.apk` |
            | web | served by `${{ env.IMAGE }}:sha-${{ github.sha }}` |
            | web (static) | `web-${{ github.sha }}.zip` |

            A client only updates to a version **higher** than the one it runs, so this
            release must keep its version: retagging or lowering it stops updates.
          files: |
            dist/desktop/*
            dist/linux/*
            dist/android/*
            dist/*.zip
          fail_on_unmatched_files: false
