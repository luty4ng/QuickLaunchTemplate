# 服务器专用的 compose 覆盖文件：把 app 接到已有的 Traefik 上。
#
# 为什么不直接改仓库里的 compose.yaml：那份要同时服务"在 GitHub runner 上
# 起临时栈做冒烟"的场景，那里没有 Traefik、也不需要对外暴露。这份覆盖文件
# 只存在于服务器上（由 CD 每次部署时同步），把两部分差异隔离在一处。
#
# 用法：docker compose -f compose.yaml -f compose.server.yaml up -d
# 注意：不要加 -v，那会删掉 Postgres 数据卷。
#
# 域名与项目名来自 project.env（deploy.sh 会把它 export 出来），不写死在这里：
# 换项目时只改 project.env，Traefik 的 Host 规则和路由名会自动跟着变。

services:
  app:
    # 不再自己监听宿主端口：只让 Traefik 通过内部网络访问。
    ports: !reset []
    networks:
      - default
      - traefik-net
    labels:
      traefik.enable: "true"
      traefik.docker.network: traefik-net
      traefik.http.routers.${COMPOSE_PROJECT_NAME:-quicklaunch}.rule: Host(`${APP_DOMAIN}`, `${APP_DOMAIN}`)
      traefik.http.routers.${COMPOSE_PROJECT_NAME:-quicklaunch}.entrypoints: websecure
      traefik.http.routers.${COMPOSE_PROJECT_NAME:-quicklaunch}.tls.certresolver: letsencrypt
      traefik.http.services.${COMPOSE_PROJECT_NAME:-quicklaunch}.loadbalancer.server.port: "8000"

networks:
  traefik-net:
    external: true
