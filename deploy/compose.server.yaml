# 服务器专用的 compose 覆盖文件：把 app 接到已有的 Traefik 上。
#
# 为什么不直接改仓库里的 compose.yaml：那份要同时服务"在 GitHub runner 上
# 起临时栈做冒烟"的场景，那里没有 Traefik、也不需要对外暴露。这份覆盖文件
# 只存在于服务器上（由 CD 每次部署时同步），把两部分差异隔离在一处。
#
# 用法：docker compose -f compose.yaml -f compose.server.yaml up -d
# 注意：不要加 -v，那会删掉 Postgres 数据卷。
#
# 域名来自 project.env（deploy.sh 会 export 出来），不写死在这里：
# 换项目时只改 project.env，Traefik 的 Host 规则会自动跟着变。
#
# 两处关于 Traefik 的细节都是踩过的，别改回去：
#   * **路由名不插值**——compose 只插值 label 的值，不插值 label 的键；
#     写成 `${...}` 会原样变成一个叫 "${...}" 的路由。所以这里是字面量，
#     由 scripts/project_env.py check 保证它与 project.env 的 slug 一致。
#   * **`Host()` 只接受一个参数**——写成 `Host(\`a\`, \`a\`)` 会让 Traefik 直接报
#     "unexpected number of parameters; got 2"，路由建不起来，公网变 404。
#     这个错是部署后的公网冒烟抓出来的：部署本身成功了，是门禁把它拦下的。

services:
  app:
    # 不再自己监听宿主端口：只让 Traefik 通过内部网络访问。
    ports: !reset []
    networks:
      - default
      - traefik-net
    volumes:
      # 桌面端的更新源：CI 把 latest.yml 写进 ~/<slug>/updates/，应用直接把它读出来
      # （GET /updates/latest.yml）。放在 Release 里会让下载页多一个 yml 文件，
      # 而客户端要的只是这个 feed，所以由应用自己发。
      - ./updates:/app/updates:ro
    labels:
      traefik.enable: "true"
      traefik.docker.network: traefik-net
      traefik.http.routers.quicklaunch.rule: Host(`${APP_DOMAIN}`)
      traefik.http.routers.quicklaunch.entrypoints: websecure
      traefik.http.routers.quicklaunch.tls.certresolver: letsencrypt
      traefik.http.services.quicklaunch.loadbalancer.server.port: "8000"

networks:
  traefik-net:
    external: true
